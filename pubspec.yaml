name: accountify
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  flutter_svg: 
  google_fonts: ^6.3.2
  path_provider: ^2.1.5
  ethiopiandatepickerandconvertor: ^0.0.7
  another_telephony: ^0.4.1
  permission_handler: ^11.4.0
  path: ^1.8.3  # For path manipulation
  flutter_secure_storage: ^8.0.0  # For storing encryption key securely
  drift: ^2.13.0  # Type-safe SQL builder
  sqlite3_flutter_libs: ^0.5.30
  # crystal_navigation_bar: ^1.0.4
  crystal_navigation_bar: 
    path: /Users/mike/Documents/my_projects/tmp/crystal_navigation_bar
  intl: ^0.20.2
  flutter_local_notifications: ^20.1.0
  flutter_background_service: ^5.1.0
  awesome_notifications: ^0.11.0
  url_launcher: ^6.3.2
  share_plus: ^10.0.0
  flutter_overlay_window: ^0.5.0
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0  # Biometric (fingerprint/face) unlock for app lock
  crypto: ^3.0.3  # SHA-256 hashing for the app-lock PIN

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.12.2  # For code generation
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1  # Generates launcher icons from app_icon.png

# Launcher icon configuration. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ adaptive icon: white background behind the coin foreground.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/bank_icons/
    - assets/images/
